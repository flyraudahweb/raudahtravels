# Render Blueprint — Raudah Travels & Tours
# Single Web Service (Option B: API serves frontend static files)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: raudah-travels
    runtime: node
    plan: starter # Always-on service required for webhook processing
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true # Render auto-generates a random value
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false # Persistent 64-character hex key for encrypted admin credentials
      - key: APP_URL
        sync: false # Full HTTPS origin, e.g. https://your-service.onrender.com
      - key: AI_REGISTRATION_ENABLED
        value: "false" # Enable after migrations, credentials and smoke checks
      - key: GEMINI_PASSPORT_MODEL
        value: gemini-3.8-flash
      - key: TRUST_PROXY_HOPS
        value: "1"
